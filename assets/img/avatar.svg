<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#8F6FFF"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- subtle neural-net motif -->
  <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.4">
    <line x1="34" y1="52" x2="66" y2="70"/>
    <line x1="34" y1="52" x2="60" y2="34"/>
    <line x1="60" y1="34" x2="92" y2="46"/>
    <line x1="66" y1="70" x2="92" y2="46"/>
    <line x1="150" y1="146" x2="168" y2="118"/>
    <line x1="150" y1="146" x2="128" y2="164"/>
    <line x1="128" y1="164" x2="108" y2="150"/>
    <line x1="168" y1="118" x2="140" y2="112"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.55">
    <circle cx="34" cy="52" r="3.2"/>
    <circle cx="60" cy="34" r="3.2"/>
    <circle cx="92" cy="46" r="3.2"/>
    <circle cx="66" cy="70" r="3.2"/>
    <circle cx="150" cy="146" r="3.2"/>
    <circle cx="168" cy="118" r="3.2"/>
    <circle cx="128" cy="164" r="3.2"/>
    <circle cx="140" cy="112" r="3.2"/>
    <circle cx="108" cy="150" r="3.2"/>
  </g>

  <!-- monogram -->
  <text x="100" y="122" text-anchor="middle"
        font-family="'Lato', 'Source Sans Pro', 'Segoe UI', Arial, sans-serif"
        font-size="70" font-weight="700" fill="#ffffff">LC</text>
</svg>
