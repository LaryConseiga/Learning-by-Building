<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Mécanisme de la cellule mémoire LSTM</title>
<desc>Une cellule mémoire LSTM avec une connexion à elle-même de poids 1, contrôlée par une porte qui décide de conserver ou d'effacer l'information au fil du temps.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="300" fill="#FFFFFF"/>

<circle cx="340" cy="130" r="60" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="340" y="122" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">Cellule</text>
<text x="340" y="140" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">mémoire</text>

<path d="M 380 90 A 90 90 0 0 1 380 170" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#arrow)"/>
<text x="470" y="118" font-size="12" fill="#5F5E5A">Connexion à soi-même</text>
<text x="470" y="134" font-size="14" font-weight="600" fill="#2C2C2A">poids = 1</text>

<rect x="200" y="110" width="70" height="40" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="235" y="126" font-size="14" font-weight="600" fill="#633806" text-anchor="middle">Porte</text>
<text x="235" y="142" font-size="12" fill="#854F0B" text-anchor="middle">0 à 1</text>
<line x1="270" y1="130" x2="280" y2="130" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="80" y="122" font-size="12" fill="#5F5E5A">Signal externe</text>
<text x="80" y="138" font-size="12" fill="#5F5E5A">(nouveau mot)</text>
<line x1="150" y1="130" x2="198" y2="130" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="40" y1="220" x2="640" y2="220" stroke="#B4B2A9" stroke-width="0.5"/>

<rect x="40" y="240" width="190" height="46" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="56" y="257" font-size="12" fill="#5F5E5A">Poids de connexion 0,5</text>
<text x="56" y="275" font-size="14" font-weight="600" fill="#2C2C2A">S'évanouit (vanishing)</text>

<rect x="245" y="240" width="190" height="46" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="261" y="257" font-size="12" fill="#0F6E56">Poids de connexion 1</text>
<text x="261" y="275" font-size="14" font-weight="600" fill="#04342C">Stable, point d'équilibre</text>

<rect x="450" y="240" width="190" height="46" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="466" y="257" font-size="12" fill="#5F5E5A">Poids de connexion 1,5</text>
<text x="466" y="275" font-size="14" font-weight="600" fill="#2C2C2A">Explose (exploding)</text>
</svg>
