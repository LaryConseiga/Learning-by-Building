<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Georgia, 'Times New Roman', serif">
<title>Mécanisme du partage de poids dans une couche convolutive</title>
<desc>Un même petit filtre de 3x3 poids glisse successivement sur plusieurs positions d'une image, produisant une feature map, avec un pooling final qui réduit la taille.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="400" fill="#FFFFFF"/>

<text x="40" y="34" font-size="14" font-weight="600" fill="#2C2C2A">Image d'entrée</text>
<rect x="40" y="50" width="180" height="180" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<g stroke="#D3D1C7" stroke-width="0.5">
<line x1="40" y1="80" x2="220" y2="80"/><line x1="40" y1="110" x2="220" y2="110"/>
<line x1="40" y1="140" x2="220" y2="140"/><line x1="40" y1="170" x2="220" y2="170"/><line x1="40" y1="200" x2="220" y2="200"/>
<line x1="70" y1="50" x2="70" y2="230"/><line x1="100" y1="50" x2="100" y2="230"/><line x1="130" y1="50" x2="130" y2="230"/>
<line x1="160" y1="50" x2="160" y2="230"/><line x1="190" y1="50" x2="190" y2="230"/>
</g>

<rect x="40" y="50" width="90" height="90" rx="4" fill="none" stroke="#BA7517" stroke-width="2"/>
<text x="85" y="150" font-size="12" fill="#5F5E5A" text-anchor="middle">Position 1</text>

<rect x="130" y="50" width="90" height="90" rx="4" fill="none" stroke="#0F6E56" stroke-width="2"/>
<text x="175" y="164" font-size="12" fill="#5F5E5A" text-anchor="middle">Position 2</text>

<text x="130" y="252" font-size="12" fill="#5F5E5A" text-anchor="middle">Le même filtre 3x3 (9 poids) glisse sur toute l'image</text>

<line x1="230" y1="140" x2="270" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="280" y="60" width="130" height="160" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="345" y="42" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle">Feature map</text>
<g fill="#EF9F27">
<rect x="292" y="72" width="24" height="24" rx="3"/>
<rect x="320" y="72" width="24" height="24" rx="3" opacity="0.4"/>
<rect x="348" y="72" width="24" height="24" rx="3" opacity="0.6"/>
<rect x="376" y="72" width="24" height="24" rx="3" opacity="0.3"/>
<rect x="292" y="100" width="24" height="24" rx="3" opacity="0.5"/>
<rect x="320" y="100" width="24" height="24" rx="3" opacity="0.9"/>
<rect x="348" y="100" width="24" height="24" rx="3" opacity="0.3"/>
<rect x="376" y="100" width="24" height="24" rx="3" opacity="0.7"/>
</g>
<text x="345" y="150" font-size="12" fill="#5F5E5A" text-anchor="middle">Une valeur = une activation</text>
<text x="345" y="166" font-size="12" fill="#5F5E5A" text-anchor="middle">du filtre à cette position</text>

<line x1="420" y1="140" x2="460" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="470" y="90" width="90" height="90" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="515" y="72" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle">Pooling 2x2</text>
<g fill="#7F77DD">
<rect x="486" y="106" width="24" height="24" rx="3" opacity="0.9"/>
<rect x="520" y="106" width="24" height="24" rx="3" opacity="0.5"/>
<rect x="486" y="140" width="24" height="24" rx="3" opacity="0.6"/>
<rect x="520" y="140" width="24" height="24" rx="3" opacity="0.7"/>
</g>
<text x="515" y="196" font-size="12" fill="#5F5E5A" text-anchor="middle">Taille réduite, max local</text>
<text x="515" y="212" font-size="12" fill="#5F5E5A" text-anchor="middle">gardé, aucun poids appris</text>

<line x1="40" y1="300" x2="640" y2="300" stroke="#B4B2A9" stroke-width="0.5"/>

<text x="40" y="330" font-size="14" font-weight="600" fill="#2C2C2A">Ce qui change et ce qui ne change pas</text>
<rect x="40" y="345" width="290" height="44" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="56" y="362" font-size="12" fill="#5F5E5A">Poids du filtre (9 valeurs)</text>
<text x="56" y="380" font-size="14" font-weight="600" fill="#2C2C2A">Identiques à toutes les positions</text>

<rect x="350" y="345" width="290" height="44" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="366" y="362" font-size="12" fill="#5F5E5A">Position du filtre sur l'image</text>
<text x="366" y="380" font-size="14" font-weight="600" fill="#2C2C2A">Change à chaque étape (glissement)</text>
</svg>
